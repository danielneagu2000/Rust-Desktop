# Serverul propriu: hbbs (ID/rendezvous) + hbbr (relay).
# Pornește cu:  docker compose up -d     (sau folosește ./install.sh)
#
# Porturi necesare în firewall:
#   21115/tcp  test NAT
#   21116/tcp  + 21116/udp  ID/rendezvous (hbbs)
#   21117/tcp  relay (hbbr)
#   21118/tcp, 21119/tcp  doar pentru clientul web (opțional)
#   21114/tcp  API pentru panoul de securitate (clienții trimit aici jurnalele)
#   80/tcp, 443/tcp  pagina de descărcare (serviciul "web", activ cu COMPOSE_PROFILES=web)
#
# Panoul de securitate ascultă pe 21120, implicit doar local (127.0.0.1); vezi GHID.md.
# ":z" pe volume = etichetă SELinux partajată (necesar pe AlmaLinux/Rocky; ignorat în rest).

services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:1.1.16
    # -r: unde le spune clienților să găsească relay-ul.
    # -k _: acceptă doar clienții care au cheia publică a acestui server.
    command: hbbs -r ${SERVER_HOST:?setează SERVER_HOST în server/.env}:21117 -k _
    volumes:
      - ./data:/root:z
    # host network: hbbs vede IP-urile reale ale clienților (necesar pentru conexiuni directe/NAT).
    network_mode: host
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbr -k _
    # Fără limite de viteză pe relay: implicit hbbr limitează la 1 Gb/s total,
    # 128 Mb/s pe conexiune și reduce la 32 Mb/s conexiunile încărcate după 30 min.
    # Valorile sunt în Mb/s; 100000 = practic nelimitat (limita devine placa de rețea).
    environment:
      - TOTAL_BANDWIDTH=100000
      - SINGLE_BANDWIDTH=100000
      - LIMIT_SPEED=100000
    volumes:
      - ./data:/root:z
    network_mode: host
    # hbbs generează perechea de chei la primul start; hbbr o folosește pe aceeași.
    depends_on:
      - hbbs
    restart: unless-stopped

  panel:
    container_name: rustdesk-panel
    image: rdn-panel:local
    build: ./panel
    pull_policy: build
    environment:
      - PANEL_USER=${PANEL_USER:-admin}
      - PANEL_PASSWORD=${PANEL_PASSWORD:?setează PANEL_PASSWORD în server/.env}
      - PANEL_BIND=${PANEL_BIND:-127.0.0.1}
      - PANEL_TOTP_SECRET=${PANEL_TOTP_SECRET:-}
      - RETENTION_DAYS=${RETENTION_DAYS:-180}
      - LICENSE_REQUIRED=${LICENSE_REQUIRED:-Y}
      - DATA_DIR=/data
    volumes:
      - ./panel:/app:ro,z
      - ./data:/data:z
      # Inclus în backup-uri (server/panel/backup.py); doar citire.
      - ./.env:/config/server.env:ro,z
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  # Pagina de descărcare (server/web). Pornește doar cu profilul "web" (install.sh îl
  # activează dacă porturile 80/443 sunt libere, adică nu ai deja Apache/Nginx/Virtualmin).
  web:
    container_name: rustdesk-web
    image: caddy:2.11-alpine
    profiles: ["web"]
    environment:
      - WEB_ADDRESS=${WEB_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./caddy-sites:/etc/caddy/sites:ro,z
      - ./web:/srv:ro,z
      - ./data/caddy:/data:z
    network_mode: host
    restart: unless-stopped
