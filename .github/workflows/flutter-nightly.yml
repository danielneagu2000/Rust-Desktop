name: Flutter Nightly Build

on:
  workflow_dispatch:

jobs:
  check-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify the sources carry the branding from branding/brand.env
        run: python3 branding/apply.py --check

  run-flutter-nightly-build:
    needs: check-branding
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
