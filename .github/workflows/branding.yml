name: Apply branding

# Edit branding/brand.env (and optionally branding/logo.png) on GitHub, push,
# and this workflow regenerates the branded sources and commits them back.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "branding/brand.env"
      - "branding/logo.png"
      - "branding/logo-small.png"
      - "branding/logo-app.png"
      - "branding/logo-app-dark.png"
      - "branding/apply.py"

permissions:
  contents: write

concurrency:
  group: apply-branding
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check that branding is configured
        id: configured
        run: |
          if grep -q '=CHANGE_ME' branding/brand.env; then
            echo "::notice::branding/brand.env still has CHANGE_ME values; fill them in (see GHID.md) to brand the sources."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Pillow
        if: steps.configured.outputs.ready == 'true'
        run: python3 -m pip install --user pillow

      - name: Apply branding
        if: steps.configured.outputs.ready == 'true'
        run: python3 branding/apply.py

      - name: Commit branded sources
        if: steps.configured.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Icons are *.png, which the upstream .gitignore excludes; add tracked changes only.
          git add -u
          git add -f branding/.applied
          git add -f flutter/assets/logo.png flutter/assets/logo_dark.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sources already branded; nothing to commit."
            exit 0
          fi
          git commit -m "Apply branding from branding/brand.env"
          git push
